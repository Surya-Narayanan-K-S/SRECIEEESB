name: 🐛 Bug Report
description: Report an issue or bug in the IEEE SREC Web Platform
title: "[BUG]: "
labels: ["bug", "triage"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report an issue! Please provide as much information as possible.
  - type: input
    id: version
    attributes:
      label: Version / Environment
      description: What browser and version or platform are you using?
      placeholder: Chrome 124 / Firefox / Android WebView
    validations:
      required: true
  - type: textarea
    id: description
    attributes:
      label: Bug Description
      description: A clear and concise description of what the bug is.
      placeholder: Describe the problem...
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Steps to Reproduce
      description: Exact steps to reproduce the behavior.
      value: |
        1. Go to '...'
        2. Click on '....'
        3. See error
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected Behavior
      description: What did you expect to happen?
    validations:
      required: true
  - type: textarea
    id: screenshots
    attributes:
      label: Screenshots or Console Logs
      description: Attach screenshots, screen recordings, or paste browser console error logs if applicable.
