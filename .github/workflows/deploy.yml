# -----------------------------------------------------------------------------
# GitHub Actions Workflow: GoDaddy FTP Deployment
# -----------------------------------------------------------------------------
# NOTE ON VS CODE WARNINGS ("Context access might be invalid"):
# VS Code flags `${{ secrets.XXX }}` with yellow warnings because GitHub Secrets
# are managed online in your GitHub Repository settings and not locally.
# These warnings are purely informational and will NOT cause build failures.
#
# Before running this workflow, add the following secrets in GitHub:
# Repo -> Settings -> Secrets and variables -> Actions:
#   - FTP_SERVER       (e.g., ftp.srecieee.org or GoDaddy IP)
#   - FTP_USERNAME     (Your cPanel FTP username)
#   - FTP_PASSWORD     (Your cPanel FTP password)
#   - VITE_SUPABASE_URL
#   - VITE_SUPABASE_ANON_KEY
# -----------------------------------------------------------------------------

name: Deploy Main Site (srecieee.org) to GoDaddy cPanel

on:
  push:
    branches:
      - main
      - master

jobs:
  web-deploy:
    name: Deploy site to GoDaddy via FTP
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm ci

      - name: Build Vite project
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
        run: npm run build

      - name: Sync files to GoDaddy cPanel
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          local-dir: ./dist/
          server-dir: /public_html/
